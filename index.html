    <title>Esteban Ríos | Full Stack Developer</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #0a0a0d;
        font-family: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
      }
      #splash .brand {
        font-size: 22px;
        font-weight: 600;
        letter-spacing: -0.02em;
        color: #fafafa;
        animation: splash-pulse 1.2s ease-in-out infinite alternate;
      }
      #splash .brand em {
        font-style: normal;
        color: #dc2626;
      }
      #splash .bar {
        width: 140px;
        height: 2px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.1);
      }
      #splash .bar span {
        display: block;
        width: 40%;
        height: 100%;
        background: linear-gradient(90deg, #dc2626, #f87171);
        animation: splash-bar 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        to {
          opacity: 0.65;
        }
      }
      @keyframes splash-bar {
        from {
          transform: translateX(-150%);
        }
        to {
          transform: translateX(360%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash" aria-hidden="true">
        <div class="brand">esteban<em>.dev</em></div>
        <div class="bar"><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
